<!DOCTYPE html>
<html lang="es" data-tema="claro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dasna — Mi panel</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✨</text></svg>">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#23a6d5" id="meta-tema">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="/estilos/dasna.css">
    <script>
        // Tema antes de pintar nada (sin parpadeo): preferencia guardada o la del sistema
        (function () {
            try {
                var guardado = localStorage.getItem('dasna-tema');
                var tema = guardado || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro');
                document.documentElement.dataset.tema = tema;
            } catch (e) { /* sin almacenamiento: tema claro */ }
        })();
    </script>
</head>
<body>

    <!-- ================= CABECERA (arriba) ================= -->
    <header class="barra-superior">
        <div class="barra-izq">
            <span class="barra-logo">DASNA</span>
            <button class="abrir-buscador" id="btn-buscador">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg> Buscar
            </button>
        </div>
        <div class="barra-dcha">
            <span class="sesion-email" id="sesion-email">…</span>
            <button class="icono-btn" id="btn-tema" title="Cambiar tema (claro/oscuro)" aria-label="Cambiar tema"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></button>
            <button class="icono-btn" id="btn-salir" title="Tu cuenta" aria-label="Tu cuenta" aria-haspopup="menu" aria-expanded="false"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg></button>
        </div>
    </header>

    <!-- ================= CONTENIDO ================= -->
    <main class="contenido">
        <header class="cabecera">
            <a class="volver oculto" id="volver" href="#/panel">← Panel</a>
            <div>
                <h1 id="vista-titulo">Panel</h1>
                <p id="vista-sub">Cargando…</p>
            </div>
        </header>

        <section id="vista" aria-live="polite"></section>
    </main>

    <!-- ================= BUSCADOR UNIVERSAL ================= -->
    <div class="buscador-overlay oculto" id="buscador-overlay">
        <div class="buscador-caja" role="dialog" aria-label="Buscador">
            <input class="entrada" id="buscador-input" placeholder="Busca un módulo o vista…" autocomplete="off">
            <ul class="buscador-lista" id="buscador-lista"></ul>
        </div>
    </div>

    <div id="toasts"></div>

    <script src="/estelas.js"></script>
    <script src="/rest.js"></script>
    <script src="/app.js"></script>
    <script src="/modulos.js"></script>
    <script src="/modulos-vida.js"></script>
    <script src="/modulos-eventos.js"></script>
    <script src="/modulos-panel.js"></script>
</body>
</html>
