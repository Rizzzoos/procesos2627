<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dasna - Sana y potencia tu interior</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✨</text></svg>">
    <!-- PWA: instalable en el móvil como una aplicación -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#23a6d5">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        /* Login con la misma estética que la app: aura apagada, cristal
           azul marino, letra Inter, texto blanco y acento turquesa */
        :root {
            --aura-1: #ee7752; --aura-2: #e73c7e; --aura-3: #23a6d5; --aura-4: #23d5ab;
            --mezcla: #3b4a63;
            --texto: #ffffff;
            --texto-suave: rgba(255, 255, 255, 0.88);
            --texto-tenue: rgba(255, 255, 255, 0.62);
            --cristal: rgba(11, 26, 56, 0.5);
            --cristal-fuerte: rgba(8, 20, 46, 0.64);
            --cristal-borde: rgba(255, 255, 255, 0.45);
            --acento: #2dd4bf;
            --entrada: rgba(6, 16, 38, 0.42);
        }
        [data-tema='oscuro'] {
            --aura-1: #0b1a33; --aura-2: #0d2b2b; --aura-3: #0b2530; --aura-4: #1a1440;
            --mezcla: #0b1a33;
            --texto: #e9eef8;
            --texto-suave: #c3cede;
            --texto-tenue: #8fa1b8;
            --cristal: rgba(18, 30, 52, 0.79);
            --cristal-fuerte: rgba(22, 36, 60, 0.91);
            --cristal-borde: rgba(255, 255, 255, 0.20);
            --entrada: rgba(15, 23, 42, 0.6);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 1.2rem 1rem;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            letter-spacing: -0.005em;
            color: var(--texto);
            background: linear-gradient(-45deg,
                color-mix(in oklab, var(--aura-1) 58%, var(--mezcla)),
                color-mix(in oklab, var(--aura-2) 58%, var(--mezcla)),
                color-mix(in oklab, var(--aura-3) 58%, var(--mezcla)),
                color-mix(in oklab, var(--aura-4) 58%, var(--mezcla)));
            background-size: 220% 220%;
            animation: respirar 120s ease-in-out infinite;
        }
        @keyframes respirar {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @media (prefers-reduced-motion: reduce) { body { animation: none; } }
        #fondo-estelas { opacity: 0.3; }
        .card {
            position: relative;
            z-index: 1;
            background: var(--cristal);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            padding: 1.9rem 1.7rem;
            border-radius: 26px;
            border: 1px solid var(--cristal-borde);
            box-shadow: 0 16px 44px rgba(0, 0, 0, 0.28);
            width: 100%;
            max-width: 380px;
            text-align: center;
        }
        h1 { font-size: 1.5rem; margin: 0 0 0.3rem; font-weight: 700; letter-spacing: 0.3em; }
        p.subtitle { color: var(--texto-suave); font-size: 0.88rem; margin: 0 0 1.3rem; }
        .form-group { margin-bottom: 0.95rem; text-align: left; }
        label {
            display: block;
            font-size: 0.72rem;
            font-weight: 700;
            margin-bottom: 0.35rem;
            color: var(--texto-tenue);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        input {
            width: 100%;
            padding: 0.72rem 0.85rem;
            background: var(--entrada);
            border: 1px solid var(--cristal-borde);
            border-radius: 14px;
            font-size: 0.95rem;
            font-family: inherit;
            color: #fff;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        input:focus { outline: none; border-color: var(--acento); box-shadow: 0 0 0 3px rgba(45, 212, 191, 0.25); }
        input::placeholder { color: rgba(255, 255, 255, 0.5); }
        button { font-family: inherit; }
        .campo-clave { position: relative; display: block; }
        .campo-clave input { padding-right: 2.9rem; }
        .ver-clave {
            position: absolute; top: 50%; right: 0.35rem; transform: translateY(-50%);
            width: 2.4rem; height: 2.4rem; display: grid; place-items: center;
            background: none; border: 0; border-radius: 10px; cursor: pointer;
            color: var(--texto-tenue);
        }
        .ver-clave:hover, .ver-clave:focus-visible { color: #fff; outline: none; background: rgba(255, 255, 255, 0.08); }
        .ver-clave svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        #mensaje { margin-top: 1rem; font-size: 0.88rem; font-weight: 600; }
        .tabs {
            display: flex;
            gap: 0.25rem;
            padding: 0.25rem;
            margin-bottom: 1.3rem;
            background: var(--cristal-fuerte);
            border: 1px solid var(--cristal-borde);
            border-radius: 999px;
        }
        .tab {
            flex: 1;
            padding: 0.5rem;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--texto-suave);
            background: none;
            border: none;
            border-radius: 999px;
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease;
        }
        .tab.activo { background: var(--acento); color: #06322c; }
        .btn-primario {
            width: 100%;
            padding: 0.8rem;
            margin-top: 0.6rem;
            background: linear-gradient(135deg, #a78bfa, #f687b3);
            color: #fff;
            border: none;
            border-radius: 14px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(167, 139, 250, 0.4);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .btn-primario:hover { transform: translateY(-2px); box-shadow: 0 9px 24px rgba(167, 139, 250, 0.55); }
        .hint { display: block; font-size: 0.75rem; color: var(--texto-tenue); margin: -0.2rem 0 0.5rem; text-transform: none; letter-spacing: 0; }
        .oculto { display: none; }
        .enlace-suave {
            display: block; margin: -0.35rem 0 0.9rem auto; padding: 0.2rem 0;
            background: none; border: 0; cursor: pointer;
            font-size: 0.8rem; font-weight: 600; color: var(--texto-tenue); text-align: right;
        }
        .enlace-suave:hover, .enlace-suave:focus-visible { color: #fff; text-decoration: underline; outline: none; }
        .titulo-form { margin: 0 0 0.4rem; font-size: 1.05rem; text-align: left; }
        .texto-form { margin: 0 0 1rem; font-size: 0.85rem; color: var(--texto-suave); text-align: left; }
        .mensaje-form { margin-top: 15px; font-weight: bold; text-align: center; font-size: 0.88rem; }
        .fila-volver { text-align: center; margin-top: 0.8rem; }
        .fila-volver .enlace-suave { display: inline-block; margin: 0; text-align: center; }
        .oauth-box { margin-top: 1.2rem; }
        .oauth-divisor {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--texto-tenue);
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 1rem;
        }
        .oauth-divisor::before, .oauth-divisor::after { content: ''; flex: 1; height: 1px; background: var(--cristal-borde); }
        .btn-google {
            width: 100%;
            padding: 0.72rem 1rem;
            background: var(--cristal-fuerte);
            color: var(--texto);
            border: 1px solid var(--cristal-borde);
            border-radius: 14px;
            font-size: 0.92rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: transform 0.2s ease, background 0.2s ease;
        }
        .btn-google:hover { transform: translateY(-2px); background: rgba(17, 38, 78, 0.58); }
    </style>
    <script>
        // Mismo tema (claro/oscuro) que la app
        (function () {
            try {
                var t = localStorage.getItem('dasna-tema') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro');
                document.documentElement.dataset.tema = t;
            } catch (e) { /* tema claro */ }
        })();
    </script>
</head>
<body>

    <div class="card">
        <h1>Dasna</h1>
        <p class="subtitle">Manifiesta. Organiza. Evoluciona.</p>

        <!-- Pestañas para cambiar entre iniciar sesión y crear cuenta -->
        <div class="tabs">
            <button type="button" class="tab activo" id="tab-login" onclick="mostrarLogin()">Iniciar sesión</button>
            <button type="button" class="tab" id="tab-registro" onclick="mostrarRegistro()">Crear cuenta</button>
        </div>

        <!-- FORMULARIO: Iniciar sesión -->
        <form id="formLogin" autocomplete="off">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="hola@universo.com" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="button" class="enlace-suave" onclick="mostrarRecuperar()">¿Has olvidado tu contraseña?</button>

            <button type="button" class="btn-primario" onclick="enviarDatos('/api/login')">Iniciar sesión</button>

            <div id="mensaje" style="margin-top: 15px; font-weight: bold; text-align: center;"></div>
        </form>

        <!-- FORMULARIO: Crear cuenta -->
        <form id="formRegistro" class="oculto" autocomplete="off">
            <div class="form-group">
                <label for="reg-email">Email</label>
                <input type="email" id="reg-email" placeholder="hola@universo.com" required>
            </div>

            <div class="form-group">
                <label for="reg-nombre">Nombre</label>
                <span class="hint">(opcional)</span>
                <input type="text" id="reg-nombre" placeholder="Tu nombre">
            </div>

            <div class="form-group">
                <label for="reg-password">Contraseña</label>
                <span class="hint">(mínimo 8 caracteres)</span>
                <input type="password" id="reg-password" placeholder="••••••••" minlength="8" required>
            </div>

            <div class="form-group">
                <label for="reg-password2">Repite la contraseña</label>
                <input type="password" id="reg-password2" placeholder="••••••••" minlength="8" required>
            </div>

            <button type="button" class="btn-primario" onclick="crearCuenta()">Crear cuenta</button>

            <div id="mensajeRegistro" style="margin-top: 15px; font-weight: bold; text-align: center;"></div>
        </form>

        <!-- FORMULARIO: Recuperar contraseña (pedir el enlace) -->
        <form id="formRecuperar" class="oculto" autocomplete="off" onsubmit="event.preventDefault(); pedirRecuperacion();">
            <h2 class="titulo-form">Recuperar contraseña</h2>
            <p class="texto-form">Escribe tu correo y te enviaremos un enlace para elegir una contraseña nueva.</p>
            <div class="form-group">
                <label for="rec-email">Email</label>
                <input type="email" id="rec-email" placeholder="hola@universo.com" required>
            </div>
            <button type="submit" class="btn-primario" id="rec-enviar">Enviar enlace</button>
            <div id="mensajeRecuperar" class="mensaje-form" role="status"></div>
            <div class="fila-volver"><button type="button" class="enlace-suave" onclick="mostrarLogin()">Volver a iniciar sesión</button></div>
        </form>

        <!-- FORMULARIO: Elegir contraseña nueva (se llega desde el enlace del correo) -->
        <form id="formRestablecer" class="oculto" autocomplete="off" onsubmit="event.preventDefault(); guardarNuevaContrasena();">
            <h2 class="titulo-form">Elige una contraseña nueva</h2>
            <div class="form-group">
                <label for="res-password">Contraseña nueva</label>
                <span class="hint">(mínimo 8 caracteres)</span>
                <input type="password" id="res-password" placeholder="••••••••" minlength="8" required>
            </div>
            <div class="form-group">
                <label for="res-password2">Repite la contraseña</label>
                <input type="password" id="res-password2" placeholder="••••••••" minlength="8" required>
            </div>
            <button type="submit" class="btn-primario" id="res-guardar">Guardar contraseña</button>
            <div id="mensajeRestablecer" class="mensaje-form" role="status"></div>
            <div class="fila-volver"><button type="button" class="enlace-suave" onclick="mostrarLogin()">Volver a iniciar sesión</button></div>
        </form>

        <!-- HITO 4: acceso con proveedor externo (Google) -->
        <div class="oauth-box">
            <div class="oauth-divisor"><span>o continúa con</span></div>
            <button type="button" class="btn-google" onclick="entrarConGoogle()">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.1a6.6 6.6 0 0 1 0-4.2V7.06H2.18a11 11 0 0 0 0 9.88l3.66-2.84z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15A11 11 0 0 0 2.18 7.06l3.66 2.84C6.71 7.31 9.14 5.38 12 5.38z"/>
                </svg>
                Iniciar sesión con Google
            </button>
        </div>
    </div>
    <script src="rest.js"></script>
    <script src="estelas.js"></script>
    <script>
        // Ojo para ver u ocultar la contraseña
        (function () {
            const OJO = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
            const OJO_TACHADO = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.6 5.1A10 10 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-2.6 3.5M6.6 6.6C3.9 8.4 2 12 2 12s3.5 7 10 7c1.9 0 3.6-.6 5-1.5"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="M3 3l18 18"/></svg>';
            document.querySelectorAll('input[type="password"]').forEach((input) => {
                const caja = document.createElement('span');
                caja.className = 'campo-clave';
                input.parentNode.insertBefore(caja, input);
                caja.appendChild(input);
                const boton = document.createElement('button');
                boton.type = 'button';
                boton.className = 'ver-clave';
                const pintar = () => {
                    const visible = input.type === 'text';
                    boton.innerHTML = visible ? OJO_TACHADO : OJO;
                    boton.setAttribute('aria-label', visible ? 'Ocultar contraseña' : 'Mostrar contraseña');
                    boton.title = boton.getAttribute('aria-label');
                };
                boton.addEventListener('click', () => {
                    input.type = input.type === 'password' ? 'text' : 'password';
                    pintar();
                    input.focus();
                });
                pintar();
                caja.appendChild(boton);
            });
        })();

        // PWA: registrar el service worker (permite instalar y modo offline)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(() => {});
            });
        }
    </script>
</body>
</html>
