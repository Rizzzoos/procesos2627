<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dasna - Sana y potencia tu interior</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✨</text></svg>">
    <style>
        :root {
            --text-main: #2d3748;
            --text-muted: #4a5568;
            --glass-bg: rgba(255, 255, 255, 0.25);
            --glass-border: rgba(255, 255, 255, 0.5);
            --input-bg: rgba(255, 255, 255, 0.5);
        }

        /* FONDO ANIMADO: Efecto Aura en movimiento */
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            
            /* Colores del aura: Lavanda, melocotón, rosado y azul suave */
            background: linear-gradient(-45deg, #e0c3fc, #8ec5fc, #ffecd2, #fcb69f);
            background-size: 400% 400%;
            animation: auraMovement 12s ease infinite;
            color: var(--text-main);
        }

        /* Animación fluida del aura */
        @keyframes auraMovement {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* RECUADRO ESTÉTICO (Glassmorphism avanzado) */
        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 3rem 2.5rem;
            border-radius: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--glass-border);
            width: 100%;
            max-width: 380px;
            box-sizing: border-box;
            text-align: center;
        }

        h1 {
            font-size: 2.2rem;
            margin: 0 0 0.5rem 0;
            font-weight: 300;
            letter-spacing: 2px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 2.5rem;
            font-weight: 400;
        }

        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input {
            width: 100%;
            padding: 0.9rem;
            background: var(--input-bg);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 15px;
            font-size: 1rem;
            box-sizing: border-box;
            color: var(--text-main);
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.8);
            border-color: #fff;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }

        input::placeholder {
            color: #a0aec0;
        }

        button {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #a78bfa, #f687b3);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 1rem;
            box-shadow: 0 4px 15px rgba(167, 139, 250, 0.4);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(167, 139, 250, 0.6);
        }

        #mensaje {
            margin-top: 1.5rem;
            font-size: 0.9rem;
            font-weight: 500;
        }

        /* --- Pestañas Iniciar sesión / Crear cuenta --- */
        .tabs {
            display: flex;
            margin-bottom: 2rem;
            border-bottom: 2px solid rgba(255, 255, 255, 0.4);
        }

        .tab {
            flex: 1;
            padding: 0.9rem 0.5rem;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
            cursor: pointer;
            box-shadow: none;
            border-radius: 12px 12px 0 0;
        }

        .tab:hover {
            transform: none;
            box-shadow: none;
        }

        .tab.activo {
            color: var(--text-main);
            border-bottom-color: #f687b3;
        }

        /* Botón principal (verde) */
        .btn-primario {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #7f9d62, #6b8a52);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 1rem;
            box-shadow: 0 4px 15px rgba(107, 138, 82, 0.4);
        }

        .btn-primario:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(107, 138, 82, 0.6);
        }

        /* Texto pequeño bajo las etiquetas */
        .hint {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin: -0.25rem 0 0.5rem 0;
            text-transform: none;
            letter-spacing: 0;
        }

        .oculto {
            display: none;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Dasna</h1>
        <p class="subtitle">Manifiesta. Organiza. Evoluciona.</p>

        <!-- Pestañas para cambiar entre iniciar sesión y crear cuenta -->
        <div class="tabs">
            <button type="button" class="tab activo" id="tab-login" onclick="mostrarLogin()">Iniciar sesión</button>
            <button type="button" class="tab" id="tab-registro" onclick="mostrarRegistro()">Crear cuenta</button>
        </div>

        <!-- FORMULARIO: Iniciar sesión -->
        <form id="formLogin" autocomplete="off">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="hola@universo.com" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="button" class="btn-primario" onclick="enviarDatos('/api/login')">Iniciar sesión</button>

            <div id="mensaje" style="margin-top: 15px; font-weight: bold; text-align: center;"></div>
        </form>

        <!-- FORMULARIO: Crear cuenta -->
        <form id="formRegistro" class="oculto" autocomplete="off">
            <div class="form-group">
                <label for="reg-email">Email</label>
                <input type="email" id="reg-email" placeholder="hola@universo.com" required>
            </div>

            <div class="form-group">
                <label for="reg-nombre">Nombre</label>
                <span class="hint">(opcional)</span>
                <input type="text" id="reg-nombre" placeholder="Tu nombre">
            </div>

            <div class="form-group">
                <label for="reg-password">Contraseña</label>
                <span class="hint">(mínimo 8 caracteres)</span>
                <input type="password" id="reg-password" placeholder="••••••••" minlength="8" required>
            </div>

            <div class="form-group">
                <label for="reg-password2">Repite la contraseña</label>
                <input type="password" id="reg-password2" placeholder="••••••••" minlength="8" required>
            </div>

            <button type="button" class="btn-primario" onclick="crearCuenta()">Crear cuenta</button>

            <div id="mensajeRegistro" style="margin-top: 15px; font-weight: bold; text-align: center;"></div>
        </form>
    </div>
    <script src="rest.js"></script>
</body>
</html>
